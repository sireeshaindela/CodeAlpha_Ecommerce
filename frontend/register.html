<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create an Account — ShopEasy</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/auth.css" />
  <link rel="stylesheet" href="/css/responsive.css" />
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="/index.html" class="nav-logo">
        <span class="nav-logo-icon">S</span>
        <span>ShopEasy</span>
      </a>

      <nav>
        <ul class="nav-links">
          <li><a href="/index.html" class="nav-link">Home</a></li>
          <li><a href="/login.html" class="btn btn-outline btn-sm">Sign In</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Auth Layout -->
  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h2>Join ShopEasy</h2>
        <p>Create your customer account in less than a minute</p>
      </div>

      <div id="reg-alert" class="alert-box"></div>

      <form id="register-form" class="auth-form">
        <div class="form-group">
          <label for="reg-name">Full Name *</label>
          <input type="text" id="reg-name" class="form-control" required placeholder="John Doe" autocomplete="name" />
        </div>

        <div class="form-group">
          <label for="reg-email">Email Address *</label>
          <input type="email" id="reg-email" class="form-control" required placeholder="name@example.com" autocomplete="email" />
          <span class="form-hint">We normalize and securely enforce unique email accounts.</span>
        </div>

        <div class="form-group">
          <label for="reg-phone">Phone Number (Optional)</label>
          <input type="tel" id="reg-phone" class="form-control" placeholder="+91 98765 43210" autocomplete="tel" />
        </div>

        <div class="form-group">
          <label for="reg-password">Password *</label>
          <input type="password" id="reg-password" class="form-control" required placeholder="At least 6 characters" minlength="6" autocomplete="new-password" />
        </div>

        <div class="form-group">
          <label for="reg-confirm-password">Confirm Password *</label>
          <input type="password" id="reg-confirm-password" class="form-control" required placeholder="Re-type your password" minlength="6" autocomplete="new-password" />
        </div>

        <button type="submit" id="reg-submit-btn" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 8px;">
          Create Free Account &rarr;
        </button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="/login.html">Sign In</a>
      </div>
    </div>
  </main>

  <script src="/js/utils.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
