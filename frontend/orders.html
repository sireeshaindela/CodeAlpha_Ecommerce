<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Orders — ShopEasy</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/responsive.css" />
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="/index.html" class="nav-logo">
        <span class="nav-logo-icon">S</span>
        <span>ShopEasy</span>
      </a>

      <div class="nav-search">
        <span class="nav-search-icon">🔍</span>
        <input type="text" id="global-search-input" placeholder="Search products..." />
      </div>

      <nav>
        <ul class="nav-links">
          <li><a href="/index.html" class="nav-link">Home</a></li>
          <li><a href="/index.html#products-section" class="nav-link">Catalog</a></li>
          <li>
            <a href="/cart.html" class="nav-cart-btn" id="nav-cart-btn" title="Shopping Cart">
              <span>🛒</span>
              <span>Cart</span>
              <span class="cart-badge" id="nav-cart-count" style="display: none;">0</span>
            </a>
          </li>
          <li id="nav-user-container">
            <a href="/login.html" class="btn btn-outline btn-sm">Log In</a>
          </li>
        </ul>
      </nav>

      <button class="mobile-nav-toggle" aria-label="Toggle navigation">☰</button>
    </div>
  </header>

  <!-- Orders Container -->
  <main class="container" style="padding-top: 32px; padding-bottom: 60px;">
    <div style="margin-bottom: 28px;">
      <h1 style="font-size: 2rem; font-weight: 800; color: var(--text-main); letter-spacing: -0.5px;">My Orders</h1>
      <p style="color: var(--text-muted); font-size: 0.95rem;">Track recent purchases, inspect itemized receipts, and check delivery status</p>
    </div>

    <div id="orders-list-container">
      <div class="spinner-container">
        <div class="spinner"></div>
        <p>Retrieving order history from database...</p>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container footer-bottom">
      <div>&copy; 2026 ShopEasy • CodeAlpha Full Stack Development Internship</div>
      <div><a href="/index.html">&larr; Return to Catalog</a></div>
    </div>
  </footer>

  <script src="/js/utils.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/orders.js"></script>
</body>
</html>
